<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>العلوم | مبادرة التكنولوجيا للجميع</title><style>body{margin:0;background:#09192e;color:#edf3fb;font:17px/1.9 Tahoma,Arial,sans-serif}main{max-width:780px;margin:45px auto;padding:24px}a{color:#8fdfd9}.card{padding:26px;border:1px solid #365670;border-radius:18px;background:#132b45}h1{color:#ebcd8b}button{display:block;width:100%;text-align:right;padding:13px 18px;background:#203e59;border:1px solid #496983;border-radius:12px;color:white;cursor:pointer;margin:9px 0;font:inherit}button:hover{background:#315772}.ok{background:#17684f!important}.bad{background:#78373b!important}.hint{color:#bad0df}#next{background:#d9b96f;color:#142536;font-weight:700}#next:disabled{opacity:.45}#feedback{min-height:40px}</style><main><a href="../../">← العودة إلى المبادرة</a><h1>العلوم</h1><p>تدريبات تفاعلية في العلوم الأساسية</p><p class="hint">نشاط تعليمي تفاعلي نموذجي مجاني، وليس بديلاً عن المنهج الدراسي المعتمد.</p><div class="card"><p id="progress"></p><h2 id="question"></h2><div id="choices"></div><p id="feedback" aria-live="polite"></p><button id="next" disabled>السؤال التالي</button></div></main><script>const data=[["أي عضو يضخ الدم في جسم الإنسان؟",["القلب","الرئتان","المعدة"],0],["ما الغاز الذي تحتاج إليه النباتات في عملية البناء الضوئي؟",["الأكسجين","ثاني أكسيد الكربون","النيتروجين"],1],["أي الكواكب أقرب إلى الشمس؟",["الزهرة","الأرض","عطارد"],2]];let i=0,score=0,answered=false;const el=id=>document.getElementById(id);function render(){answered=false;el('next').disabled=true;el('feedback').textContent='';el('progress').textContent='السؤال '+(i+1)+' من '+data.length;el('question').textContent=data[i][0];el('choices').replaceChildren();data[i][1].forEach((a,j)=>{const b=document.createElement('button');b.textContent=a;b.onclick=()=>{if(answered)return;answered=true;const correct=j===data[i][2];if(correct)score++;b.classList.add(correct?'ok':'bad');el('feedback').textContent=correct?'إجابة صحيحة!':'الإجابة الصحيحة: '+data[i][1][data[i][2]];el('next').disabled=false};el('choices').appendChild(b)});el('next').textContent=i===data.length-1?'عرض النتيجة':'السؤال التالي'}el('next').onclick=()=>{i++;if(i<data.length){render();return}el('progress').textContent='اكتمل النشاط';el('question').textContent='درجتك: '+score+' من '+data.length;el('choices').replaceChildren();el('feedback').textContent='يمكنك إعادة المحاولة لمراجعة المعلومات.';el('next').textContent='إعادة الاختبار';el('next').onclick=()=>{i=0;score=0;el('next').onclick=advance;render()};};const advance=el('next').onclick;render();</script></html>
